name: SDK CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: node --test ./tests/smoke.test.mjs

      - name: Verify npm package contents
        run: npm run pack:dry-run

  php:
    name: PHP SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate Packagist manifest
        run: composer validate --strict

      - name: Validate package manifest
        working-directory: php
        run: composer validate --strict

      - name: Install dependencies
        working-directory: php
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        working-directory: php
        run: composer test

  laravel:
    name: Laravel 12 provisioning / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install isolated Laravel test dependencies
        working-directory: php
        run: composer require --dev 'laravel/framework:^12.0' --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      - name: Run PHP and Laravel tests without skipped bridge tests
        working-directory: php
        run: vendor/bin/phpunit --do-not-cache-result --fail-on-skipped
